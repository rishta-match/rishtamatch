  <div class="top" ${own?"":`onclick="openP('${id}')"`}>${avatar(p)}<div><div class="name">${esc(p.name)}</div>
  <div class="meta">${esc(p.age)} yrs · ${esc(p.city)}${p.height?" · "+esc(p.height):""}</div>
  <span class="badge">${esc(p.comm||p.rel||"")}</span>${own?"":tag(p)}${p.diet?`<span class="badge">${dietL(p.diet)}</span>`:""}</div></div>
  <div class="bio"><b>${esc(p.job)}</b>${p.edu?" · "+esc(p.edu):""}<br>${esc(p.bio)}</div>
  ${own?"":`<div class="row"><button class="btn ${s?"done":""}" onclick="tog('${id}')">${s?t("sld"):t("sl")}</button>
  <button class="btn ${i?"done":"fill"}" onclick="intr('${id}')">${i?t("sid"):t("si")}</button></div>`}</div>`;
}
function openP(id){
  id=String(id);const p=findP(id);if(!p)return;
  const s=short.includes(id),i=sent.includes(id),m=score(p);
  const msg=encodeURIComponent(`RishtaMatch par ye profile dekhein: ${p.name}, ${p.age} yrs, ${p.city}\n${location.href.split("#")[0]}`);
  document.getElementById("modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">
  <div class="center">${avatar(p,1)}<h2 style="margin-top:10px">${esc(p.name)}</h2>
  <div class="meta">${esc(p.age)} yrs · ${esc(p.city)} ${m?`· <b style="color:var(--ok)">${m}% ${t("match")}</b>`:""}</div></div>
  <div class="dl"><div><small>${t("job")}</small>${esc(p.job)}</div><div><small>${t("edu")}</small>${esc(p.edu)}</div>
  <div><small>${t("rel")}</small>${esc(p.rel)}</div><div><small>${t("comm")}</small>${esc(p.comm)}</div>
  <div><small>${t("height")}</small>${esc(p.height)}</div><div><small>${t("diet")}</small>${dietL(p.diet)}</div></div>
  <p style="font-size:14px">${esc(p.bio)}</p>
  ${p.real?"":`<div class="demo" style="display:block;border-radius:12px;font-size:12px">${t("sampleNote")}</div>`}
  <div class="row" style="margin-bottom:8px"><button class="btn ${s?"done":""}" onclick="tog('${id}');openP('${id}')">${s?t("sld"):t("sl")}</button>
  <button class="btn ${i?"done":"fill"}" onclick="intr('${id}')">${i?t("sid"):t("si")}</button></div>
  <div class="row">${p.real?"":`<a class="btn wa" style="text-align:center;text-decoration:none;padding:10px" href="https://wa.me/?text=${msg}" target="_blank" rel="noopener">WhatsApp ${t("wa")}</a>`}
  <button class="btn red" onclick="rep('${id}')">⚠ ${t("report")}</button><button class="btn" onclick="blk('${id}')">🚫 ${t("block")}</button></div>
  <button class="btn" style="width:100%;margin-top:10px" onclick="closeM()">${t("close")}</button></div></div>`;
}
function closeM(){document.getElementById("modal").innerHTML=""}
async function blockId(id,report){
  id=String(id);if(!blocked.includes(id))blocked.push(id);persist("blocked",blocked);
  if(isReal(id)&&sb&&user){
    if(report)await sb.from("reports").insert({reported:id,reason:"reported from app"});
    await sb.from("blocks").upsert({user_id:user.id,blocked_id:id});
  }
}
function rep(id){if(confirm(t("confirmR"))){closeM();blockId(id,true);render();alert(t("reported"))}}
function blk(id){closeM();blockId(id,false);render()}
/* ---------- views ---------- */
function hero(){
  const msg=encodeURIComponent("RishtaMatch: apna jeevansathi dhundhein, free aur safe. "+location.href.split("#")[0]);
  return `<section class="hero"><h1>${t("h")}</h1><p>${t("p")}</p>
  <div class="row"><button class="cta" onclick="go('mine')">${t("cta")}</button>
  <a class="cta alt" style="text-decoration:none" href="https://wa.me/?text=${msg}" target="_blank" rel="noopener">${t("share")}</a>
  ${deferredPrompt?`<button class="cta alt" onclick="installApp()">${t("install")}</button>`:""}</div>
  <div class="stats"><div><b>${t("st1")}</b>${t("st1s")}</div><div><b>${t("st2")}</b>${t("st2s")}</div><div><b>${t("st3")}</b>${t("st3s")}</div></div></section>`;
}
function setF(k,v){f[k]=v;if(k==="state")f.city="";shown=24;render()}
function more(){shown+=24;render()}
function browse(){
  const all=allP();
  const rels=[...new Set(all.map(p=>p.rel).filter(Boolean))].sort();
  const cs=CITIES.filter(c=>!f.state||c.state===f.state);
  const q=f.q.toLowerCase();
  let l=all.filter(p=>!blocked.includes(String(p.id))&&(!f.g||p.g===f.g)&&(!f.state||p.state===f.state)&&(!f.city||p.city===f.city)&&(!f.rel||p.rel===f.rel)&&(!f.min||p.age>=+f.min)&&(!f.max||p.age<=+f.max)&&(!q||((p.name||"")+" "+(p.job||"")+" "+(p.edu||"")+" "+(p.comm||"")+" "+(p.city||"")).toLowerCase().includes(q)));
  l.sort((a,b)=>{
    const r=(a.real?0:1)-(b.real?0:1);if(r)return r;
    if(f.sort==="age")return a.age-b.age||(a.o||0)-(b.o||0);
    return mine?(score(b)-score(a))||(a.o||0)-(b.o||0):(a.o||0)-(b.o||0);
  });
  const opt=(v,sel,txt)=>`<option value="${esc(v)}" ${sel?"selected":""}>${esc(txt)}</option>`;
  return hero()+`<div class="demo">${t("demo")}</div>
  ${!user&&sb?`<div class="box" style="margin:0 0 14px;display:flex;gap:10px;align-items:center;justify-content:space-between"><span style="font-size:13px">${t("loginSee")}</span><button class="btn fill" style="flex:none;padding:8px 14px" onclick="go('mine')">${t("login")}</button></div>`:""}
  <div class="filters">
  <select onchange="setF('g',this.value)">${opt("",!f.g,t("allG"))}${opt("F",f.g==="F",t("brides"))}${opt("M",f.g==="M",t("grooms"))}</select>
  <select onchange="setF('state',this.value)">${opt("",!f.state,t("allS"))}${STATES.map(s=>opt(s,f.state===s,s)).join("")}</select>
  <select onchange="setF('city',this.value)">${opt("",!f.city,t("allC"))}${cs.map(c=>opt(c.city,f.city===c.city,c.city)).join("")}</select>
  <select onchange="setF('rel',this.value)">${opt("",!f.rel,t("allR"))}${rels.map(c=>opt(c,f.rel===c,c)).join("")}</select>
  <select onchange="setF('sort',this.value)">${opt("match",f.sort==="match",t("sortM"))}${opt("age",f.sort==="age",t("sortA"))}</select>
  <input type="number" placeholder="${t("minA")}" value="${esc(f.min)}" onchange="setF('min',this.value)">
  <input type="number" placeholder="${t("maxA")}" value="${esc(f.max)}" onchange="setF('max',this.value)">
  <input class="wide" placeholder="${t("search")}" value="${esc(f.q)}" onchange="setF('q',this.value)"></div>
  <div class="sec"><h2>${t("browse")}</h2><small></small></div>
  ${l.length?`<div class="grid">${l.slice(0,shown).map(p=>card(p)).join("")}</div>`:`<div class="empty"><div class="e">🔍</div>${t("noMatch")}</div>`}
  ${l.length>shown?`<button class="btn fill" style="width:100%;margin-top:14px;padding:13px" onclick="more()">${t("more")}</button>`:""}
  <div class="box"><h3>🛡️ ${t("safeH")}</h3><ul>${t("safe").map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div class="box"><h3>💞 ${t("storyH")}</h3><div style="font-size:13px;color:var(--muted)">${t("storyP")}</div></div>
  <footer><a href="privacy.html">${t("priv")}</a><a href="terms.html">${t("terms")}</a><div style="margin-top:8px">${t("rights")}</div></footer>`;
}
function listOf(ids,msg){
  const l=allP().filter(p=>ids.includes(String(p.id))&&!blocked.includes(String(p.id)));
  return `<div class="sec"><h2>${t(tab)}</h2>${tab==="sent"?`<small>${paid?t("unlocked"):Math.min(sent.length,FREE)+"/"+FREE+" "+t("freeUsed")}</small>`:""}</div>`+(l.length?`<div class="grid">${l.map(p=>card(p)).join("")}</div>`:`<div class="empty"><div class="e">${tab==="short"?"⭐":"💌"}</div>${msg}</div>`);
}
function authView(){
  const login=authMode==="login";
  return `<div class="sec"><h2>${login?t("loginH"):t("signupH")}</h2></div>
  <form onsubmit="doAuth(event)">
  <label>${t("email")}</label><input name="email" type="email" required autocomplete="email">
  <label>${t("password")}</label><input name="password" type="password" required minlength="6" autocomplete="${login?"current-password":"new-password"}">
  ${authMsg?`<div class="demo" style="display:block;border-radius:12px">${esc(authMsg)}</div>`:""}
  <button class="btn fill" style="padding:13px" ${busy?"disabled":""}>${login?t("login"):t("signup")}</button>
  <button type="button" class="btn" onclick="authMode='${login?"signup":"login"}';authMsg='';render()">${login?t("noAcc"):t("haveAcc")}</button></form>
  <div class="note">${t("authNote")}</div>`;
}
function mineView(){
  if(!user)return authView();
  const m=mine||{g:"M",diet:"veg"};
  const o=(v,cur,txt)=>`<option value="${v}" ${cur===v?"selected":""}>${txt}</option>`;
  const ph=pendingPhoto?pendingPhoto.url:m.photo;
  return `<div class="sec"><h2>${t("createH")}</h2><small>${esc(user.email||"")}</small></div>
  <form onsubmit="saveMine(event)">
  <div class="center" id="avPrev">${avatar({id:3,name:m.name||"?",photo:ph},1)}</div>
  <label>${t("photo")}</label><input type="file" accept="image/*" onchange="pickPhoto(this)">
  <label>${t("name")}</label><input name="name" value="${esc(m.name)}" required maxlength="60">
  <div class="g2"><div><label>${t("gender")}</label><select name="g">${o("M",m.g,t("male"))}${o("F",m.g,t("female"))}</select></div>
  <div><label>${t("age")}</label><input name="age" type="number" min="18" max="70" value="${esc(m.age)}" required></div></div>
  <div class="g2"><div><label>${t("city")}</label><input name="city" value="${esc(m.city)}" required maxlength="40"></div>
  <div><label>${t("height")}</label><input name="height" placeholder="5'8&quot;" value="${esc(m.height)}" maxlength="10"></div></div>
  <div class="g2"><div><label>${t("rel")}</label><input name="rel" value="${esc(m.rel)}" maxlength="30"></div>
  <div><label>${t("comm")}</label><input name="comm" value="${esc(m.comm)}" maxlength="30"></div></div>
  <div class="g2"><div><label>${t("edu")}</label><input name="edu" value="${esc(m.edu)}" maxlength="40"></div>
  <div><label>${t("job")}</label><input name="job" value="${esc(m.job)}" maxlength="40"></div></div>
  <label>${t("diet")}</label><select name="diet">${o("veg",m.diet,t("veg"))}${o("nonveg",m.diet,t("nonveg"))}</select>
  <label>${t("bio")}</label><textarea name="bio" rows="3" maxlength="300">${esc(m.bio)}</textarea>
  <button class="btn fill" style="padding:13px" ${busy?"disabled":""}>${t("save")}</button></form>
  ${mine?`<div class="sec" style="margin-top:18px"><h2>Preview</h2></div><div class="grid">${card(mine,true)}</div>`:""}
  <div class="note">${t("savedNote")}</div>
  <button class="btn" style="width:100%" onclick="logout()">${t("logout")}</button>`;
}
/* ---------- app shell ---------- */
function nav(){
  const items=[["browse","🏠",t("browse"),0],["short","⭐",t("short"),short.length],["sent","💌",t("sent"),sent.length],["mine","👤",t("mine"),0]];
  document.getElementById("nav").innerHTML=items.map(([k,i,l,n])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')"><span>${i}</span>${l}${n?`<i>${n}</i>`:""}</button>`).join("");
  document.getElementById("bLang").textContent=lang==="en"?"हिं":"EN";
  document.getElementById("bTheme").textContent=theme==="dark"?"☀️":"🌙";
  document.documentElement.dataset.theme=theme;document.documentElement.lang=lang==="hi"?"hi":"en";
}
function render(){
  nav();
  document.getElementById("app").innerHTML=tab==="browse"?browse():tab==="short"?listOf(short,t("noShort")):tab==="sent"?listOf(sent,t("noSent")):mineView();
}
function go(k){tab=k;render();window.scrollTo({top:0,behavior:"smooth"})}
async function tog(id){
  id=String(id);const on=short.includes(id);
  short=on?short.filter(x=>x!==id):[...short,id];persist("short",short);
  if(isReal(id)&&sb&&user){
    const r=on?await sb.from("shortlists").delete().match({user_id:user.id,profile_id:id}):await sb.from("shortlists").insert({profile_id:id});
    if(r.error)console.warn(r.error.message);
  }
  render();
}
async function intr(id){
  id=String(id);if(sent.includes(id))return;
  if(!user){closeM();alert(t("loginNeeded"));go("mine");return}
  if(!mine){closeM();alert(t("needProfile"));go("mine");return}
  if(sent.length>=FREE&&!paid){showPay(id);return}
  if(isReal(id)){
    const {error}=await sb.from("interests").insert({to_user:id});
    if(error&&error.code!=="23505"){
      if(error.code==="42501"||/row-level security/i.test(error.message||"")){showPay(id)}else{alert(error.message)}
      return;
    }
  }
  sent.push(id);persist("sent",sent);
  const open=document.getElementById("modal").innerHTML;
  render();if(open)openP(id);
}
function showPay(id){
  document.getElementById("modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet center">
  <div style="font-size:46px">🔓</div><h2>${t("payH")}</h2>
  <p style="font-size:14px;color:var(--muted)">${t("payP")}</p>
  <div style="font-size:40px;font-weight:700;margin:8px 0;font-family:'Playfair Display',serif">₹${PRICE}</div>
  <ul style="text-align:left;font-size:14px;line-height:1.9;margin:6px 0 14px"><li>${t("pb1")}</li><li>${t("pb2")}</li><li>${t("pb3")}</li></ul>
  <button class="btn fill" style="width:100%;padding:14px;font-size:15px" onclick="payDemo('${id}')">${t("payBtn")}</button>
  <div class="demo" style="display:block;margin:12px 0 0;border-radius:12px">${t("payNote")}</div>
  <button class="btn" style="width:100%;margin-top:10px" onclick="closeM()">${t("later")}</button></div></div>`;
}
async function payDemo(id){
  if(!sb||!user){closeM();alert(t("loginNeeded"));go("mine");return}
  const {error}=await sb.rpc("demo_unlock");
  if(error){alert(error.message);return}
  paid=true;closeM();await intr(id);
}
async function doAuth(e){
  e.preventDefault();
  if(!sb){authMsg=t("cloudOff");render();return}
  const d=Object.fromEntries(new FormData(e.target));
  busy=true;authMsg="";render();
  let r;
  try{
    r=authMode==="login"?await sb.auth.signInWithPassword({email:d.email,password:d.password})
      :await sb.auth.signUp({email:d.email,password:d.password,options:{emailRedirectTo:location.origin+location.pathname}});
  }catch(err){r={error:{message:String(err.message||err)}}}
  busy=false;
  if(r.error)authMsg=r.error.message;
  else if(authMode==="signup"&&!(r.data&&r.data.session))authMsg=t("checkEmail");
  render();
}
async function logout(){if(sb)await sb.auth.signOut()}
async function loadCloud(){
  if(!sb)return;
  if(!user){
    REAL=[];mine=null;paid=false;pendingPhoto=null;
    short=short.filter(x=>!isReal(x));sent=sent.filter(x=>!isReal(x));blocked=blocked.filter(x=>!isReal(x));
    render();return;
  }
  const [p,m,i,s,b,mem]=await Promise.all([
    sb.from("profiles").select("*").neq("id",user.id).order("created_at",{ascending:false}).limit(300),
    sb.from("profiles").select("*").eq("id",user.id).maybeSingle(),
    sb.from("interests").select("to_user").eq("from_user",user.id),
    sb.from("shortlists").select("profile_id"),
    sb.from("blocks").select("blocked_id"),
    sb.from("memberships").select("paid").maybeSingle()]);
  REAL=(p.data||[]).map(fromRow);
  mine=m.data?fromRow(m.data):null;
  paid=!!(mem.data&&mem.data.paid);
  sent=[...sent.filter(x=>!isReal(x)),...(i.data||[]).map(r=>r.to_user)];
  short=[...short.filter(x=>!isReal(x)),...(s.data||[]).map(r=>r.profile_id)];
  blocked=[...blocked.filter(x=>!isReal(x)),...(b.data||[]).map(r=>r.blocked_id)];
  render();
}
async function saveMine(e){
  e.preventDefault();
  if(!sb||!user){alert(t("loginNeeded"));return}
  const d=Object.fromEntries(new FormData(e.target));
  busy=true;
  let photo_url=mine&&mine.real&&mine.photo?mine.photo:null;
  if(pendingPhoto){
    const path=user.id+"/avatar.jpg";
    const up=await sb.storage.from("photos").upload(path,pendingPhoto.blob,{upsert:true,contentType:"image/jpeg"});
    if(up.error){busy=false;alert(up.error.message);return}
    photo_url=sb.storage.from("photos").getPublicUrl(path).data.publicUrl+"?v="+Date.now();
  }
  const c=CITIES.find(x=>x.city.toLowerCase()===d.city.trim().toLowerCase());
  const row={id:user.id,name:d.name.trim(),gender:d.g,age:+d.age,city:d.city.trim(),state:c?c.state:null,edu:d.edu||null,job:d.job||null,comm:d.comm||null,rel:d.rel||null,height:d.height||null,diet:d.diet,bio:d.bio||null,photo_url,updated_at:new Date().toISOString()};
  const {error}=await sb.from("profiles").upsert(row);
  busy=false;
  if(error){alert(error.message);render();return}
  pendingPhoto=null;mine=fromRow(row);render();window.scrollTo({top:0,behavior:"smooth"});
}
function pickPhoto(inp){
  const file=inp.files&&inp.files[0];if(!file)return;
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    const S=480,c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d");
    const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
    x.drawImage(img,sx,sy,m,m,0,0,S,S);URL.revokeObjectURL(url);
    c.toBlob(b=>{
      pendingPhoto={blob:b,url:c.toDataURL("image/jpeg",.8)};
      const el=document.getElementById("avPrev");if(el)el.innerHTML=`<img class="av big" src="${pendingPhoto.url}" alt="">`;
    },"image/jpeg",.82);
  };img.src=url;
}
function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()})}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(tab==="browse")render()});
document.getElementById("bLang").onclick=()=>{lang=lang==="en"?"hi":"en";sv("lang",lang);render()};
document.getElementById("bTheme").onclick=()=>{theme=theme==="dark"?"light":"dark";sv("theme",theme);render()};
if(sb)sb.auth.onAuthStateChange((ev,session)=>{
  const u=session&&session.user||null;
  if(u&&user&&u.id===user.id)return;
  user=u;setTimeout(loadCloud,0);
});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
